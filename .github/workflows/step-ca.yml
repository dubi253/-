name: Download Step-CA Images Suite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Package Step-CA Images
        run: |
          # 定义 Step-CA 相关的镜像
          IMAGES=(
            "smallstep/step-ca:latest"
          )

          echo "=========================================="
          echo "1. 开始拉取 Step-CA 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "3. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          OUTPUT_NAME="step-ca-images.tar.gz"
          docker save ${IMAGES[*]} | gzip > "$OUTPUT_NAME"

          echo "=========================================="
          echo "打包成功！Step-CA 离线包最终大小为："
          du -sh "$OUTPUT_NAME"
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: step-ca-images.tar.gz
          archive: false
          retention-days: 1
