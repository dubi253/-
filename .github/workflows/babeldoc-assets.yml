name: Download BabelDOC Offline Assets

on:
  workflow_dispatch:        # 支持手动触发

jobs:
  generate-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install BabelDOC
        run: |
          python -m pip install --upgrade pip
          pip install "BabelDOC[openai]"

      - name: Generate offline assets
        run: |
          babeldoc --generate-offline-assets ./babeldoc-assets

      - name: Upload offline assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: babeldoc-offline-assets
          path: ./babeldoc-assets
          retention-days: 1
          if-no-files-found: error
