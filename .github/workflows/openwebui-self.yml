name: Download Open-Webui only Offline Images Suite

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Pull and Package Hermes Image
        run: |
          # 定义 Open-Webui 相关的镜像
          IMAGES=(
            "ghcr.io/open-webui/open-webui:latest"
          )

          echo "=========================================="
          echo "1. 开始拉取 Open-Webui 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Build Offline-ready OpenWebUI Image
        run: |
          WEBUI_VERSION="ghcr.io/open-webui/open-webui:latest"
          TARGET_IMAGE="ghcr.io/open-webui/open-webui:latest"

          if [ -z "$WEBUI_VERSION" ] || [ -z "$TARGET_IMAGE" ]; then
            echo "Error: WEBUI_VERSION 或 TARGET_IMAGE 为空"
            exit 1
          fi

          echo "=========================================="
          echo "正在构建离线增强版 Open WebUI 镜像..."
          echo "Helm 版本: $WEBUI_VERSION"
          echo "基础镜像: $TARGET_IMAGE"
          echo "输出标签: $TARGET_IMAGE"
          echo "=========================================="

          docker build \
            --pull=false \
            --build-arg BASE_IMAGE="$TARGET_IMAGE" \
            -f open-webui/Dockerfile \
            -t "$TARGET_IMAGE" \
            open-webui

          docker image inspect "$TARGET_IMAGE" >/dev/null
          echo "定制镜像构建完成，已覆盖标签: $TARGET_IMAGE"
          
      - name: Save All Images
        run: |
          echo "=========================================="
          echo "2. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          OUTPUT_NAME="open-webui-images.tar.gz"
          docker save "ghcr.io/open-webui/open-webui:latest" | gzip > "$OUTPUT_NAME"

          echo "=========================================="
          echo "打包成功！Open-Webui 离线包最终大小为："
          du -sh "$OUTPUT_NAME"
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: open-webui-images.tar.gz
          archive: false
          retention-days: 1
