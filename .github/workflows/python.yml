name: Download Python Images Suite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Package Python Images
        run: |
          # 定义 Multica 相关的镜像
          IMAGES=(
            "python:3.10-slim"
            "python:3.11-slim"
            "python:3.12-slim"
            "python:3.13-slim"
            "python:3.14-slim"
          )

          echo "=========================================="
          echo "1. 开始拉取 Python 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "3. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          OUTPUT_NAME="python-images.tar.gz"
          docker save ${IMAGES[*]} | gzip > "$OUTPUT_NAME"

          echo "=========================================="
          echo "打包成功！Multica 离线包最终大小为："
          du -sh "$OUTPUT_NAME"
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: python-images.tar.gz
          archive: false
          retention-days: 1
