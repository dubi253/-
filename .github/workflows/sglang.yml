name: Download SGLang Offline Image

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Disk Space Reclaimer
        uses: insightsengineering/disk-space-reclaimer@v1.1.2
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tools-cache: false

      - name: Pull and Package Images
        run: |
          IMAGES=(
            "lmsysorg/sglang:latest-runtime"
          )
          OUTPUT_NAME="sglang-images.tar.gz"

          echo "=========================================="
          echo "1. 开始拉取 SGLang 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "2. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          docker save "${IMAGES[@]}" | gzip | split -b 4900M -d - "$OUTPUT_NAME.part"

          echo "=========================================="
          echo "打包分片成功！SGLang 离线包总大小为："
          du -sh "$OUTPUT_NAME".part*
          echo "=========================================="
          echo "分片文件列表："
          ls -lh "$OUTPUT_NAME".part*
          echo "=========================================="
          echo "加载镜像命令（在目标机器上执行）："
          echo "  cat $OUTPUT_NAME.part* | docker load"
          echo "=========================================="

      - name: Upload Artifact to GitHub
        uses: dubi253/upload-artifacts@v1.0.7
        with:
          path: sglang-images.tar.gz.part*
