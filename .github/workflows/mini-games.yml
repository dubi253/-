name: Download Mini Game Offline Images Suite

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Package All Multica Images
        run: |
          # 定义 Mini Game 相关的镜像
          IMAGES=(
            "kjlion/neon-arena-fps:latest"
            "kjlion/arena-brawl:latest"
            "kjlion/bomb-party:latest"
            "kjlion/ice-climber-arena:latest"
            "systemsome/80h5:26.02.07"
            "node:24-alpine"
            "node:20-alpine"
          )

          echo "=========================================="
          echo "1. 开始拉取 Mini Game 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "3. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          docker save "${IMAGES[@]}" | gzip > "mini-game-images.tar.gz"

          echo "=========================================="
          echo "打包成功！Multica 离线包最终大小为："
          du -sh mini-game-images.tar.gz
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: mini-game-images.tar.gz
          archive: false
          retention-days: 1
