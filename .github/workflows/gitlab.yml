name: Download GitLab CE Offline Images Suite

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull and Package GitLab CE Images
        run: |
          # 定义 GitLab CE 镜像
          IMAGES=(
            "gitlab/gitlab-ce:16.8.10-ce.0"
            "gitlab/gitlab-ce:16.11.10-ce.0"
            "gitlab/gitlab-ce:17.8.7-ce.0"
            "gitlab/gitlab-ce:18.8.11-ce.0"
          )
          
          # 创建存放打包文件的目录
          mkdir -p output_images
          
          echo "=========================================="
          echo "开始逐个拉取并导出镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          
          for img in "${IMAGES[@]}"; do
            echo "------------------------------------------"
            echo "正在处理: $img"
            echo "------------------------------------------"
            
            # 1. 拉取镜像
            docker pull "$img"
            
            # 2. 生成安全的文件名（将 / 和 : 替换为连字符）
            # 例如: gitlab/gitlab-ce:16.8.10-ce.0 -> gitlab-gitlab-ce-16.8.10-ce.0.tar
            SAFE_NAME=$(echo "$img" | tr '/' '-' | tr ':' '-')
            OUTPUT_NAME="output_images/${SAFE_NAME}.tar"
            
            # 3. 直接使用 docker save 导出为 .tar 文件（不进行 gzip 压缩）
            echo "正在导出为: $OUTPUT_NAME ..."
            docker save "$img" -o "$OUTPUT_NAME"
            
            echo "导出完成，大小："
            du -sh "$OUTPUT_NAME"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-ce-images-packages
          path: output_images/*.tar
          retention-days: 1 # 在 GitHub 上临时保留 1 天供你点击下载

