name: Download LiteLLM Offline Images Suite

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Package All LiteLLM Images
        run: |
          # 定义 LiteLLM 相关的镜像
          IMAGES=(
            "docker.litellm.ai/berriai/litellm:main-stable"
            "postgres:16"
            "prom/prometheus"
            "grafana/grafana:latest"
            "redis:latest"
          )

          echo "=========================================="
          echo "1. 开始拉取 LiteLLM 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "2. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          OUTPUT_NAME="litellm-offline-package.tar.gz"
          STAGING_DIR="$(mktemp -d)"
          
          # 将所有镜像保存到一个 tar.gz 文件中
          docker save "${IMAGES[@]}" | gzip > "$STAGING_DIR/litellm-images.tar.gz"

          # 打包所有内容到最终的归档文件
          tar -czf "$OUTPUT_NAME" -C "$STAGING_DIR" litellm-images.tar.gz

          echo "=========================================="
          echo "打包成功！LiteLLM 离线包最终大小为："
          du -sh "$OUTPUT_NAME"
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: litellm-offline-package.tar.gz
          archive: false
          retention-days: 1 # 在 GitHub 上临时保留 1 天供你点击下载
