name: Download Node Images Suite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Package Node Images
        run: |
          # 定义 Node 相关的镜像
          IMAGES=(
            "node:26-slim"
            "node:24-slim"
            "node:22-slim"
          )

          echo "=========================================="
          echo "1. 开始拉取 Node 镜像（共 ${#IMAGES[@]} 个）..."
          echo "=========================================="
          for img in "${IMAGES[@]}"; do
            echo "正在下载: $img ..."
            docker pull "$img"
          done

          echo "=========================================="
          echo "3. 正在合并打包并进行 gzip 极限压缩..."
          echo "=========================================="
          OUTPUT_NAME="node-images.tar.gz"
          docker save ${IMAGES[*]} | gzip > "$OUTPUT_NAME"

          echo "=========================================="
          echo "打包成功！Node 离线包最终大小为："
          du -sh "$OUTPUT_NAME"
          echo "=========================================="

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: node-images.tar.gz
          archive: false
          retention-days: 1
