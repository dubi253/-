name: Download PaddleOCR Offline Images Suite

on:
  workflow_dispatch: # 支持在 GitHub Action 页面手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Configs
        run: |
          COMPOSE_URL="https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/refs/heads/main/deploy/paddleocr_vl_docker/accelerators/nvidia-gpu/compose.yaml"
          ENV_URL="https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/refs/heads/main/deploy/paddleocr_vl_docker/accelerators/nvidia-gpu/.env"

          echo "1. 下载 compose.yaml 和 .env 文件..."
          curl -L -o compose.yaml "$COMPOSE_URL"
          curl -L -o .env "$ENV_URL"

      - name: Pull Images via Docker Compose
        run: |
          echo "=========================================="
          echo "2. 使用 docker compose pull 拉取镜像..."
          echo "=========================================="
          # 显式指定项目名称，避免 project name must not be empty 错误
          docker compose -p paddleocr -f compose.yaml pull

      - name: Package Images and Configs
        run: |
          echo "=========================================="
          echo "3. 获取已拉取的镜像列表并打包..."
          echo "=========================================="
          OUTPUT_NAME="paddleocr-images.tar.gz"
          
          # 核心修改：使用 config --images 解析镜像列表，而不是 images --quiet
          # config --images 仅解析配置文件，不需要容器处于运行状态
          mapfile -t IMAGES < <(docker compose -p paddleocr -f compose.yaml config --images)
          
          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "错误：未获取到任何已拉取的镜像。"
            exit 1
          fi

          echo "准备打包以下镜像："
          printf '%s\n' "${IMAGES[@]}"

          # 保存所有镜像到一个 tar 文件并分片压缩
          docker save "${IMAGES[@]}" | gzip | split -b 4900M -d - "$OUTPUT_NAME.part"

          echo "=========================================="
          echo "打包分片成功！离线包总大小为："
          du -sh "$OUTPUT_NAME".part*
          echo "=========================================="
          echo "分片文件列表："
          ls -lh "$OUTPUT_NAME".part*
          echo "=========================================="
          echo "加载镜像命令（在目标机器上执行）："
          echo "  cat $OUTPUT_NAME.part* | docker load"
          echo "=========================================="

          # 将docker compose文件打包成最终的 tar.gz
          tar -czf paddleocr-docker-compose.tar.gz compose.yaml .env

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: paddleocr-docker-compose.tar.gz
          archive: false
          retention-days: 1

      - name: Upload Artifact to GitHub
        uses: dubi253/upload-artifacts@v1.0.7
        with:
          path: paddleocr-images.tar.gz.part*
          archive: false
